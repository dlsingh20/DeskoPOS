<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Restaurant Setup Form · DeskoPOS</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --ink: #1f2933; --muted: #67727e; --line: #dde3ea;
    --accent: #2563eb; --accent-soft: #e8efff; --ok: #15803d; --ok-soft: #e7f6ec;
    --warn: #b45309; --warn-soft: #fff4e0; --bad: #c62828; --bad-soft: #fdecec;
    --radius: 12px; --gutter: 16px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 88px; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--accent); }

  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 1180px; margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 12px; }
  .brand { font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .doc-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .save-state { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .save-state.bad { color: var(--bad); font-weight: 600; }

  .layout { max-width: 1180px; margin: 0 auto; padding: 20px var(--gutter) 120px; display: grid; gap: 24px;
    grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .layout { grid-template-columns: 230px minmax(0, 1fr); } }

  nav.steps { display: none; }
  @media (min-width: 960px) {
    nav.steps { display: block; position: sticky; top: 76px; align-self: start; }
  }
  nav.steps ol { list-style: none; margin: 0; padding: 0; }
  nav.steps a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
    color: var(--ink); text-decoration: none; font-size: 14px; }
  nav.steps a:hover { background: var(--accent-soft); }
  .dot { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
    font-weight: 700; background: var(--line); color: var(--muted); }
  .dot.done { background: var(--ok); color: #fff; }
  .dot.bad { background: var(--bad); color: #fff; }
  .progress { font-size: 13px; color: var(--muted); margin: 0 10px 10px; }

  .intro h1 { font-size: clamp(22px, 3vw, 28px); margin: 0 0 6px; letter-spacing: -0.02em; }
  .intro p { margin: 0 0 6px; color: var(--muted); max-width: 70ch; }

  .banner { border-radius: var(--radius); padding: 12px 14px; margin: 14px 0; font-size: 14px; border: 1px solid transparent; }
  .banner.info { background: var(--accent-soft); border-color: #c9d8ff; }
  .banner.ok { background: var(--ok-soft); border-color: #bfe5cb; }
  .banner.warn { background: var(--warn-soft); border-color: #f5d9a8; }
  .banner.bad { background: var(--bad-soft); border-color: #f3c0c0; }
  .banner ul { margin: 6px 0 0; padding-left: 20px; }
  .banner strong { display: block; }
  .banner .actions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }

  section.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 18px; }
  @media (min-width: 640px) { section.card { padding: 22px 24px; } }
  section.card > h2 { margin: 0 0 4px; font-size: 18px; display: flex; gap: 10px; align-items: baseline; }
  section.card > h2 .num { color: var(--accent); }
  .help { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
  section.card > .help { margin-bottom: 14px; }

  .grid { display: grid; gap: 14px 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .field.wide { grid-column: 1 / -1; }
  .field label.lbl, .field legend { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; padding: 0; }
  .req { color: var(--bad); margin-left: 2px; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=time], input[type=date],
  select, textarea {
    width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #c8d0d9; border-radius: 9px; background: #fff;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
    outline: 3px solid #bcd0ff; outline-offset: 1px; border-color: var(--accent);
  }
  input:disabled, select:disabled, textarea:disabled { background: #f3f5f8; color: var(--ink); }
  .field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--bad); background: #fffafa; }
  .field .err { color: var(--bad); font-size: 13px; margin-top: 4px; font-weight: 600; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; min-height: 42px;
    border: 1px solid #c8d0d9; border-radius: 9px; background: #fff; cursor: pointer; }
  .choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

  .item { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; background: #fbfcfe; }
  .item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .item-head h3 { margin: 0; font-size: 16px; }

  .rows { display: grid; gap: 8px; }
  .row { display: grid; gap: 8px; align-items: end; grid-template-columns: minmax(0, 1fr); padding: 10px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .row .cell-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; }
  .row-head { display: none; }
  @media (min-width: 640px) {
    .row { grid-template-columns: var(--cols) 44px; padding: 0; border: 0; background: transparent; }
    .row .cell-label { display: none; }
    .row-head { display: grid; gap: 8px; grid-template-columns: var(--cols) 44px; font-size: 12px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 16px;
    border-radius: 9px; border: 1px solid #c8d0d9; background: #fff; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:hover { background: #f1f4f8; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #1d4fd8; }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-left: 8px; padding-right: 8px; }
  .btn.ghost:hover { background: var(--accent-soft); }
  .btn.icon { width: 44px; padding: 0; color: var(--muted); }
  .btn.icon:hover { color: var(--bad); background: var(--bad-soft); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .add-row { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .bulk { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; padding: 10px;
    border: 1px dashed #c8d0d9; border-radius: 10px; font-size: 14px; }
  .bulk input { width: 84px; min-height: 38px; }
  .bulk input.area { width: 150px; }

  .files { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; }
  .files li { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; border: 1px solid var(--line);
    border-radius: 9px; background: #fff; min-width: 0; }
  .files a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .files .size { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .upload { display: inline-flex; }
  .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .upload:focus-within .btn { outline: 3px solid #bcd0ff; }

  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card);
    border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(15, 23, 42, .06); }
  .actionbar-in { max-width: 1180px; margin: 0 auto; padding: 10px var(--gutter); display: flex; gap: 10px;
    align-items: center; justify-content: flex-end; flex-wrap: wrap; }
  .actionbar-in .note { margin-right: auto; font-size: 13px; color: var(--muted); }
  @media (max-width: 520px) { .actionbar-in .btn { flex: 1; } .actionbar-in .note { width: 100%; } }

  .center { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand">Desko<span>POS</span></div>
  <div class="doc-title" id="doc-title"></div>
  <div class="save-state" id="save-state" role="status" aria-live="polite"></div>
</div></header>
<div id="app"><div class="center"><p>Loading your form…</p></div></div>

<script>
(() => {
  'use strict';
  const token = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
  const editKey = new URLSearchParams(location.hash.slice(1)).get('key') || '';
  const API = `/api/irf/${encodeURIComponent(token)}/`;
  const AUTOSAVE_MS = 2500;

  const S = { form: null, schema: [], data: {}, files: [], version: null, dirty: false, saving: false,
    saveError: null, problems: [], banner: null, uploads: 0 };
  let saveTimer = null;
  let queue = Promise.resolve();

  // ---------- small helpers ----------
  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v === null || v === undefined) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k in el && typeof v !== 'string') el[k] = v;
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : String(c));
    return el;
  }
  const pathId = (path) => path.join('-');
  const getIn = (obj, path) => path.reduce((o, k) => (o == null ? undefined : o[k]), obj);
  function setIn(obj, path, value) {
    let o = obj;
    path.slice(0, -1).forEach((k, i) => {
      if (o[k] == null) o[k] = typeof path[i + 1] === 'number' ? [] : {};
      o = o[k];
    });
    o[path[path.length - 1]] = value;
  }
  const isEmpty = (v) => v === null || v === undefined || (typeof v === 'string' && !v.trim()) || (Array.isArray(v) && !v.length);
  const kb = (n) => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
  const time = (d) => new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const editable = () => S.form && S.form.editable;

  async function call(path, opts = {}) {
    const headers = { Accept: 'application/json', ...(opts.headers || {}) };
    if (editKey) headers['X-IRF-Key'] = editKey;
    let body = opts.body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
    let res;
    try { res = await fetch(API + path, { method: opts.method || 'GET', headers, body }); }
    catch { const e = new Error('No connection. Your answers are kept on this page; we will try again.'); e.network = true; throw e; }
    const json = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) { const e = new Error((json && json.detail) || `Something went wrong (${res.status}).`); e.status = res.status; e.body = json || {}; throw e; }
    return json;
  }

  // ---------- saving ----------
  function markDirty() {
    S.dirty = true;
    showSaveState();
    const nav = document.querySelector('nav.steps');
    if (nav) nav.replaceWith(renderSteps());
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => save(), AUTOSAVE_MS);
  }
  function save() {
    clearTimeout(saveTimer);
    if (!editable()) return queue;
    queue = queue.then(async () => {
      if (!S.dirty) return;
      S.saving = true; S.dirty = false; showSaveState();
      try {
        const r = await call('', { method: 'PUT', body: { data: S.data, version: S.version } });
        S.version = r.version; S.saveError = null; S.form.last_saved_at = r.last_saved_at;
      } catch (e) {
        S.dirty = true; S.saveError = e;
        if (e.status === 409) { S.banner = conflictBanner(e.message); render(); }
        else if (e.network) { clearTimeout(saveTimer); saveTimer = setTimeout(() => save(), 10000); }
      } finally { S.saving = false; showSaveState(); }
    });
    return queue;
  }
  function showSaveState() {
    const el = $('save-state');
    if (!S.form) { el.textContent = ''; return; }
    el.classList.toggle('bad', !!S.saveError);
    if (!editable()) el.textContent = S.form.status === 'submitted' ? 'Submitted' : '';
    else if (S.saving) el.textContent = 'Saving…';
    else if (S.saveError) el.textContent = 'Not saved';
    else if (S.dirty || S.uploads) el.textContent = 'Unsaved changes';
    else if (S.form.last_saved_at) el.textContent = `Saved ${time(S.form.last_saved_at)}`;
    else el.textContent = '';
  }
  const conflictBanner = (message) => ({ kind: 'bad', title: 'Your latest changes were not saved', text: message,
    action: { label: 'Reload the form', run: () => { S.dirty = false; location.reload(); } } });
  window.addEventListener('beforeunload', (e) => {
    if (S.dirty || S.saving || S.uploads) { save(); e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- completion (mirrors the server's required-answer check, for the step list) ----------
  function sectionMissing(section) {
    let missing = 0;
    const fileCount = (path) => S.files.filter((f) => f.field === path).length;
    const check = (fields, values, path) => fields.forEach((f) => {
      const p = `${path}.${f.key}`;
      if (f.type === 'file') { if (f.required && !fileCount(p)) missing++; return; }
      if (f.required && isEmpty(values && values[f.key])) missing++;
      if (f.type === 'list') ((values && values[f.key]) || []).forEach((row, i) => check(f.fields, row, `${p}.${i}`));
    });
    const value = S.data[section.key];
    if (section.type === 'list') {
      if ((value || []).length < (section.min || 0)) missing++;
      (value || []).forEach((row, i) => check(section.fields, row, `${section.key}.${i}`));
    } else check(section.fields, value || {}, section.key);
    return missing;
  }
  const problemFor = (path) => S.problems.find((p) => p.path === path);
  const sectionHasProblem = (key) => S.problems.some((p) => p.path === key || p.path.startsWith(`${key}.`));

  // ---------- rendering ----------
  function render() {
    const y = window.scrollY;
    const app = $('app');
    app.replaceChildren(h('div', { class: 'layout' }, renderSteps(), h('main', { id: 'main' }, renderIntro(),
      S.schema.map((section, i) => renderSection(section, i + 1)))), renderActionBar());
    window.scrollTo(0, y);
    showSaveState();
  }

  function renderSteps() {
    const done = S.schema.filter((s) => !sectionMissing(s)).length;
    return h('nav', { class: 'steps', 'aria-label': 'Form sections' },
      h('p', { class: 'progress' }, `${done} of ${S.schema.length} sections complete`),
      h('ol', {}, S.schema.map((s, i) => {
        const bad = sectionHasProblem(s.key);
        const ok = !sectionMissing(s);
        return h('li', {}, h('a', { href: `#s-${s.key}` },
          h('span', { class: `dot ${bad ? 'bad' : ok ? 'done' : ''}`, 'aria-hidden': 'true' }, ok && !bad ? '✓' : i + 1),
          h('span', {}, s.title, h('span', { class: 'sr-only' }, bad ? ' (needs attention)' : ok ? ' (complete)' : ''))));
      })));
  }

  function renderIntro() {
    const f = S.form;
    const parts = [h('div', { class: 'intro' },
      h('h1', {}, 'Restaurant setup form'),
      h('p', {}, `Tell us about ${f.title} so we can set up your DeskoPOS. Your answers save automatically as you type, so you can stop and come back to this link any time.`),
      h('p', {}, 'Fields marked ', h('span', { class: 'req' }, '*'), ' are needed before you can submit. If something does not apply, leave it blank.'))];
    if (f.editor === 'admin') parts.push(h('div', { class: 'banner info', role: 'note' },
      h('strong', {}, 'You are editing as DeskoPOS staff'),
      f.status === 'submitted' ? 'This form is submitted. Your changes save to it directly; the client cannot edit it unless it is reopened.' : 'Changes save to the client\'s form.'));
    if (f.status === 'submitted' && f.editor !== 'admin') parts.push(h('div', { class: 'banner ok', role: 'status' },
      h('strong', {}, `Thank you! Submitted${f.submitted_at ? ` on ${new Date(f.submitted_at).toLocaleString()}` : ''}.`),
      'We will review your answers and get in touch. To change something now, please contact us.',
      h('div', { class: 'actions' }, h('a', { class: 'btn', href: `${API}pdf/` }, 'Download a PDF copy'))));
    if (S.banner) {
      const b = S.banner;
      parts.push(h('div', { class: `banner ${b.kind}`, role: 'alert', id: 'banner', tabindex: '-1' },
        h('strong', {}, b.title), b.text || '',
        b.list ? h('ul', {}, b.list.map((p) => h('li', {}, h('a', { href: `#w-${pathId(p.path.split('.'))}`,
          onclick: (e) => { e.preventDefault(); focusPath(p.path); } }, p.label), ` — ${p.message}`))) : null,
        b.action ? h('div', { class: 'actions' }, h('button', { class: 'btn', type: 'button', onclick: b.action.run }, b.action.label)) : null));
    }
    return parts;
  }

  function renderSection(section, number) {
    const isList = section.type === 'list';
    const problem = problemFor(section.key);
    return h('section', { class: 'card', id: `s-${section.key}`, 'aria-labelledby': `h-${section.key}` },
      h('h2', { id: `h-${section.key}` }, h('span', { class: 'num' }, `${number}.`), section.title),
      section.help ? h('p', { class: 'help' }, section.help) : null,
      problem ? h('p', { class: 'help', id: `w-${section.key}`, style: 'color:var(--bad);font-weight:600' }, problem.message) : null,
      isList ? renderList(section, [section.key]) : h('div', { class: 'grid' }, section.fields.map((f) => renderField(f, [section.key, f.key]))));
  }

  const isCardList = (def) => def.fields.some((f) => ['list', 'textarea', 'lines', 'file'].includes(f.type));

  function renderList(def, path) {
    let rows = getIn(S.data, path);
    if (!Array.isArray(rows)) { rows = []; setIn(S.data, path, rows); }
    if (!rows.length && (def.min || 0) > 0) rows.push({});
    const card = isCardList(def);
    const canRemove = editable() && rows.length > (def.min || 0);
    const remove = (i) => () => { rows.splice(i, 1); markDirty(); render(); };
    const body = card
      ? rows.map((row, i) => h('div', { class: 'item' },
          h('div', { class: 'item-head' }, h('h3', {}, `${def.item} ${i + 1}${row.name ? ` · ${row.name}` : ''}`),
            canRemove ? h('button', { class: 'btn ghost', type: 'button', onclick: remove(i) }, `Remove`) : null),
          h('div', { class: 'grid' }, def.fields.map((f) => renderField(f, [...path, i, f.key])))))
      : renderRows(def, path, rows, canRemove ? remove : null);
    const add = () => {
      if (rows.length >= (def.max || 100)) return;
      rows.push({}); markDirty(); render();
      const first = document.querySelector(`[data-path="${pathId([...path, rows.length - 1, def.fields[0].key])}"]`);
      if (first) first.focus();
    };
    return h('div', {}, body,
      editable() ? h('div', { class: 'add-row' },
        h('button', { class: 'btn', type: 'button', onclick: add, disabled: rows.length >= (def.max || 100) }, `+ Add ${def.item.toLowerCase()}`),
        def.range_key ? renderBulk(def, rows) : null) : null);
  }

  function renderRows(def, path, rows, remove) {
    const cols = def.fields.map((f) => (f.type === 'number' ? '0.6fr' : f.type === 'select' ? '1fr' : '1.2fr')).join(' ');
    if (!rows.length) return h('p', { class: 'help' }, `No ${def.item.toLowerCase()}s added yet.`);
    return h('div', { class: 'rows', style: `--cols: ${cols}` },
      h('div', { class: 'row-head', 'aria-hidden': 'true' }, def.fields.map((f) => h('div', {}, f.label, f.required ? h('span', { class: 'req' }, '*') : null)), h('div')),
      rows.map((row, i) => h('div', { class: 'row', role: 'group', 'aria-label': `${def.item} ${i + 1}` },
        def.fields.map((f) => renderField(f, [...path, i, f.key], { compact: true, rowLabel: `${def.item} ${i + 1}` })),
        remove ? h('button', { class: 'btn icon', type: 'button', 'aria-label': `Remove ${def.item.toLowerCase()} ${i + 1}`, title: 'Remove', onclick: remove(i) }, '✕') : h('div'))));
  }

  function renderBulk(def, rows) {
    const from = h('input', { type: 'number', min: '1', placeholder: 'From', 'aria-label': 'First table number' });
    const to = h('input', { type: 'number', min: '1', placeholder: 'To', 'aria-label': 'Last table number' });
    const seats = h('input', { type: 'number', min: '1', placeholder: 'Seats', 'aria-label': 'Seats at each table' });
    const area = h('input', { type: 'text', class: 'area', placeholder: 'Area (optional)', 'aria-label': 'Area' });
    const addRange = () => {
      const a = parseInt(from.value, 10); const b = parseInt(to.value, 10);
      if (!(a >= 1) || !(b >= a)) { from.focus(); return; }
      const room = (def.max || 500) - rows.length;
      for (let n = a; n <= Math.min(b, a + room - 1); n++) {
        rows.push({ [def.range_key]: String(n), seats: seats.value || '', area: area.value || '' });
      }
      markDirty(); render();
    };
    return h('div', { class: 'bulk' }, 'Quick add tables', from, 'to', to, seats, area,
      h('button', { class: 'btn', type: 'button', onclick: addRange }, 'Add'));
  }

  function renderField(f, path, opts = {}) {
    const id = `f-${pathId(path)}`;
    const value = getIn(S.data, path);
    const problem = problemFor(path.join('.'));
    const disabled = !editable();
    const describedBy = [f.help && !opts.compact ? `${id}-help` : null, problem ? `${id}-err` : null].filter(Boolean).join(' ') || null;
    const label = opts.compact
      ? h('label', { class: 'cell-label', for: id }, f.label, f.required ? h('span', { class: 'req' }, '*') : null)
      : h('label', { class: 'lbl', for: id }, f.label, f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null);
    const common = { id, 'data-path': pathId(path), disabled, required: f.required || null, 'aria-describedby': describedBy,
      'aria-invalid': problem ? 'true' : null, 'aria-label': opts.compact ? `${opts.rowLabel} ${f.label}` : null };
    const onValue = (v) => { setIn(S.data, path, v); clearProblem(path.join('.')); markDirty(); };
    let control;
    const wide = ['textarea', 'lines', 'multi', 'list', 'file'].includes(f.type);

    if (f.type === 'list') {
      return h('div', { class: 'field wide', id: `w-${pathId(path)}` },
        h('div', { class: 'lbl', style: 'font-weight:600;margin:6px 0 5px' }, f.label),
        f.help ? h('p', { class: 'help' }, f.help) : null, renderList(f, path));
    }
    if (f.type === 'file') return renderFile(f, path, problem);
    if (f.type === 'yesno' || f.type === 'multi') {
      const multi = f.type === 'multi';
      const choices = multi ? f.options : [{ value: true, label: 'Yes' }, { value: false, label: 'No' }];
      control = h('div', { class: 'choices' }, choices.map((o) => {
        const checked = multi ? (value || []).includes(o.value) : value === o.value;
        return h('label', { class: 'choice' }, h('input', {
          type: multi ? 'checkbox' : 'radio', name: id, checked, disabled,
          onchange: (e) => {
            if (!multi) return onValue(o.value);
            const set = new Set(getIn(S.data, path) || []);
            e.target.checked ? set.add(o.value) : set.delete(o.value);
            onValue(f.options.map((x) => x.value).filter((v) => set.has(v)));
          } }), o.label);
      }));
      return h('fieldset', { class: `field${wide ? ' wide' : ''}${problem ? ' invalid' : ''}`, id: `w-${pathId(path)}`, 'aria-describedby': describedBy, 'aria-invalid': problem ? 'true' : null },
        h('legend', { class: opts.compact ? 'cell-label' : 'lbl' }, f.label, f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null),
        f.help && !opts.compact ? h('p', { class: 'help', id: `${id}-help`, style: 'margin:-2px 0 6px' }, f.help) : null,
        control, problem ? h('div', { class: 'err', id: `${id}-err` }, problem.message) : null);
    }
    if (f.type === 'select') {
      control = h('select', { ...common, onchange: (e) => onValue(e.target.value || null) },
        h('option', { value: '' }, 'Choose…'),
        f.options.map((o) => h('option', { value: o.value, selected: String(value) === String(o.value) }, o.label)));
    } else if (f.type === 'textarea' || f.type === 'lines') {
      control = h('textarea', { ...common, placeholder: f.placeholder || null, rows: f.type === 'lines' ? 3 : 3,
        oninput: (e) => onValue(e.target.value) });
      control.value = Array.isArray(value) ? value.join('\n') : (value ?? '');
    } else {
      const type = { email: 'email', tel: 'tel', number: 'number', time: 'time', date: 'date' }[f.type] || 'text';
      control = h('input', { ...common, type, placeholder: f.placeholder || null,
        inputmode: f.type === 'number' ? 'decimal' : null, min: f.min ?? null, max: f.max ?? null, step: f.type === 'number' ? 'any' : null,
        autocomplete: f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'off',
        oninput: (e) => onValue(e.target.value) });
      control.value = value ?? '';
    }
    return h('div', { class: `field${wide ? ' wide' : ''}${problem ? ' invalid' : ''}`, id: `w-${pathId(path)}` },
      label, control,
      f.help && !opts.compact ? h('p', { class: 'help', id: `${id}-help` }, f.help) : null,
      problem ? h('div', { class: 'err', id: `${id}-err` }, problem.message) : null);
  }

  function renderFile(f, path, problem) {
    const key = path.join('.');
    const files = S.files.filter((x) => x.field === key);
    const id = `f-${pathId(path)}`;
    const input = h('input', { type: 'file', id, accept: f.accept, multiple: !!f.multiple, disabled: !editable(),
      'aria-describedby': problem ? `${id}-err` : null,
      onchange: (e) => upload(key, [...e.target.files], e.target) });
    return h('div', { class: `field wide${problem ? ' invalid' : ''}`, id: `w-${pathId(path)}` },
      h('div', { class: 'lbl', style: 'font-weight:600;margin-bottom:5px' }, f.label, f.required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null),
      files.length ? h('ul', { class: 'files' }, files.map((x) => h('li', {},
        h('a', { href: `${API}files/${x.id}/` }, x.name), h('span', { class: 'size' }, kb(x.size)),
        editable() ? h('button', { class: 'btn icon', type: 'button', 'aria-label': `Remove ${x.name}`, title: 'Remove',
          onclick: () => removeFile(x) }, '✕') : null))) : null,
      editable() ? h('label', { class: 'upload' }, input,
        h('span', { class: 'btn' }, S.uploads ? 'Uploading…' : files.length && f.multiple ? '+ Attach another file' : files.length ? 'Replace file' : '+ Attach file')) : (!files.length ? h('p', { class: 'help' }, 'No file attached.') : null),
      h('p', { class: 'help' }, `Allowed: ${f.accept.replaceAll(',', ', ')}. Up to ${kb(S.form.limits.file_bytes)} each.`),
      problem ? h('div', { class: 'err', id: `${id}-err` }, problem.message) : null);
  }

  // ---------- actions ----------
  function clearProblem(path) {
    const before = S.problems.length;
    S.problems = S.problems.filter((p) => p.path !== path);
    if (before !== S.problems.length) {
      const wrap = document.getElementById(`w-${pathId(path.split('.'))}`);
      if (wrap) { wrap.classList.remove('invalid'); wrap.querySelectorAll('.err').forEach((e) => e.remove()); }
    }
  }

  function focusPath(path) {
    const wrap = document.getElementById(`w-${pathId(path.split('.'))}`) || document.getElementById(`s-${path.split('.')[0]}`);
    if (!wrap) return;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const target = wrap.querySelector('input:not([type=hidden]), select, textarea');
    if (target) setTimeout(() => target.focus({ preventScroll: true }), 300);
  }

  async function upload(field, list, input) {
    if (!list.length) return;
    S.uploads++; render();
    const errors = [];
    for (const file of list) {
      if (file.size > S.form.limits.file_bytes) { errors.push(`${file.name}: larger than ${kb(S.form.limits.file_bytes)}`); continue; }
      const body = new FormData(); body.append('field', field); body.append('file', file);
      try {
        const saved = await call('files/', { method: 'POST', body });
        S.files = S.files.filter((x) => !(x.field === field && !schemaField(field).multiple)).concat(saved);
        clearProblem(field);
      } catch (e) { errors.push(`${file.name}: ${e.message}`); }
    }
    S.uploads--;
    if (input) input.value = '';
    S.banner = errors.length ? { kind: 'bad', title: 'Some files were not attached', list: null, text: errors.join(' · ') } : (S.banner && S.banner.kind === 'bad' && S.banner.title.startsWith('Some files') ? null : S.banner);
    render();
  }
  const schemaField = (key) => { const [s, f] = key.split('.'); return S.schema.find((x) => x.key === s).fields.find((x) => x.key === f); };

  async function removeFile(file) {
    if (!confirm(`Remove ${file.name}?`)) return;
    try { await call(`files/${file.id}/`, { method: 'DELETE' }); S.files = S.files.filter((x) => x.id !== file.id); render(); }
    catch (e) { S.banner = { kind: 'bad', title: 'Could not remove the file', text: e.message }; render(); }
  }

  async function submit(button) {
    if (S.uploads) return;
    const admin = S.form.editor === 'admin';
    if (!confirm(admin ? 'Submit this form on behalf of the client?' : 'Submit the form now? After submitting you will not be able to change your answers without contacting us.')) return;
    button.disabled = true;
    clearTimeout(saveTimer);
    await queue;
    try {
      const r = await call('submit/', { method: 'POST', body: { data: S.data, version: S.version } });
      S.dirty = false; S.saveError = null; S.version = r.version; S.problems = []; S.banner = null;
      Object.assign(S.form, { status: r.status, submitted_at: r.submitted_at, editable: admin, last_saved_at: new Date().toISOString() });
      render(); window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      if (e.status === 400 && e.body.code === 'incomplete') {
        S.dirty = false; S.version = e.body.version; S.problems = e.body.problems; S.form.last_saved_at = new Date().toISOString();
        S.banner = { kind: 'bad', title: `Please complete ${S.problems.length} more ${S.problems.length === 1 ? 'answer' : 'answers'} before submitting`,
          text: 'Your answers are saved.', list: S.problems };
      } else if (e.status === 409) {
        S.banner = e.body.code === 'stale_version' ? conflictBanner(e.message) : { kind: 'warn', title: 'Not submitted', text: e.message };
      } else S.banner = { kind: 'bad', title: 'Not submitted', text: e.message };
      render();
      const b = $('banner'); if (b) { b.scrollIntoView({ behavior: 'smooth', block: 'center' }); b.focus({ preventScroll: true }); }
    } finally { button.disabled = false; }
  }

  function renderActionBar() {
    const f = S.form;
    if (!editable()) return h('div');
    const saveBtn = h('button', { class: 'btn', type: 'button', onclick: () => { S.dirty = true; save(); } }, 'Save');
    const submitBtn = f.status === 'draft'
      ? h('button', { class: 'btn primary', type: 'button', onclick: (e) => submit(e.currentTarget) }, f.editor === 'admin' ? 'Submit for client' : 'Submit form')
      : null;
    return h('div', { class: 'actionbar' }, h('div', { class: 'actionbar-in' },
      h('span', { class: 'note' }, 'Answers save automatically.'), saveBtn, submitBtn));
  }

  // ---------- start ----------
  async function load() {
    try {
      const r = await call('');
      S.form = r; S.schema = r.schema; S.data = r.data || {}; S.files = r.files || []; S.version = r.version;
      $('doc-title').textContent = r.title;
      document.title = `${r.title} · Restaurant Setup Form`;
      render();
    } catch (e) {
      $('app').replaceChildren(h('div', { class: 'center' }, h('div', {},
        h('h1', {}, e.status === 404 ? 'This link is not valid' : 'Could not open the form'),
        h('p', {}, e.message), e.status === 404 ? null : h('button', { class: 'btn', onclick: () => location.reload() }, 'Try again'))));
    }
  }
  load();
})();
</script>
</body>
</html>
